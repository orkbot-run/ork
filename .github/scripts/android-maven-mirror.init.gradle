import org.gradle.api.artifacts.repositories.MavenArtifactRepository

// Keep Maven Central as a fallback while preferring its Google-hosted mirror.
def addCentralMirror = { repositories ->
  repositories.whenObjectAdded { repository ->
    if (repository instanceof MavenArtifactRepository &&
        repository.url.toString().replaceAll('/+$', '') == 'https://repo.maven.apache.org/maven2' &&
        repositories.findByName('orkMavenCentralMirror') == null) {
      def mirror = repositories.maven {
        name = 'orkMavenCentralMirror'
        url = uri('https://maven-central.storage-download.googleapis.com/maven2')
        content { includeModule('org.jetbrains.kotlin', 'kotlin-compiler-embeddable') }
      }
      repositories.remove(mirror)
      repositories.addFirst(mirror)
    }
  }
}

gradle.beforeSettings { settings ->
  addCentralMirror(settings.pluginManagement.repositories)
  addCentralMirror(settings.dependencyResolutionManagement.repositories)
}
gradle.beforeProject { project ->
  addCentralMirror(project.buildscript.repositories)
  addCentralMirror(project.repositories)
}
