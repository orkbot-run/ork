name: desktop-macos-screenshot
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-macos-screenshot
  cancel-in-progress: true

jobs:
  screenshot:
    name: macOS setup screenshot
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ORKBOT_ENABLE_AUTO_UPDATE: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: pnpm install --frozen-lockfile
      - name: Build the unsigned Tauri app
        run: pnpm --filter @orkbot/desktop tauri:build --bundles app
      - name: Capture the native setup window
        shell: bash
        run: |
          set -euo pipefail
          app="$(find apps/desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          open -n "$app"
          # Wait for the first-run setup window before capturing the runner's desktop.
          for attempt in {1..30}; do
            if [[ "$(osascript -e "tell application \"System Events\" to get exists (first process whose bundle identifier is \"$bundle_id\" and visible is true)")" == true ]]; then
              sleep 3
              mkdir -p apps/desktop/screenshots
              screencapture -x apps/desktop/screenshots/macos-setup.png
              exit 0
            fi
            sleep 1
          done
          echo "The Tauri setup window did not become visible." >&2
          exit 1
      - name: Upload native macOS setup screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos-screenshot
          path: apps/desktop/screenshots/macos-setup.png
          if-no-files-found: error
          retention-days: 7
