name: desktop-tauri-publish

on:
  workflow_run:
    workflows: [ci, desktop-tauri]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-tauri-preview-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request' &&
      vars.TAURI_PREVIEW_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      # The event must describe the current main head. Never execute PR code with this token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Publish complete, verified Preview release
        run: node .github/scripts/publish-tauri.mjs
