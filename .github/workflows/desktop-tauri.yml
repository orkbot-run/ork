name: desktop-tauri

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &tauri-paths
      - ".github/workflows/desktop-tauri.yml"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/tauri-ui/**"
      - "apps/desktop/assets/**"
      - "apps/desktop/scripts/*tauri*"
      - "apps/desktop/package.json"
      - "apps/desktop/src/setup.css"
      - "apps/desktop/src/app-document-script.ts"
      - "apps/desktop/src/locales/**"
      - "apps/desktop/scripts/build-speech.mjs"
      - "apps/desktop/native/speech/**"
      - "apps/web/src/lib/desktop.ts"
      - "apps/web/src/lib/sso-flow.ts"
      - "packages/contracts/src/desktop.ts"
      - "scripts/pnpm.mjs"
      - "pnpm-lock.yaml"
      - "packages/ui-tokens/src/**"
  pull_request:
    paths: *tauri-paths

permissions:
  contents: read

concurrency:
  group: desktop-tauri-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diagnostic-build:
    name: Experimental Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ORKBOT_ENABLE_AUTO_UPDATE: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux WebView and packaging dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --no-install-recommends -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          patchelf libssl-dev libxdo-dev
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: pnpm install --frozen-lockfile
      - name: Run native unit tests
        run: pnpm --filter @orkbot/desktop tauri:test
      - name: Check native code
        run: pnpm --filter @orkbot/desktop tauri:check
      - name: Build unsigned diagnostic installers
        run: pnpm --filter @orkbot/desktop tauri:build
      - name: Record installer sizes
        shell: bash
        run: >-
          node apps/desktop/scripts/tauri-metrics.mjs apps/desktop/src-tauri/target/release/bundle
          > "$RUNNER_TEMP/tauri-artifact-sizes.json"
      - name: Upload unsigned diagnostic installers and size report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ork-tauri-unsigned-${{ matrix.os }}-${{ github.run_id }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/release/bundle/**/*.tar.gz
            ${{ runner.temp }}/tauri-artifact-sizes.json
          if-no-files-found: error
          retention-days: 7
