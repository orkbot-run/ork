name: desktop-tauri

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/desktop-tauri.yml"
      - ".github/scripts/publish-tauri-release.mjs"
      - ".github/scripts/prepare-windows-signing-tools.mjs"
      - ".github/scripts/prepare-windows-signing-tools.test.mjs"
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "packages/avatar/**"
      - "packages/core/**"
      - "packages/chat-ui/**"
      - "packages/client-transport/**"
      - "packages/ui-web/**"
      - "packages/logging/**"
      - "scripts/pnpm.mjs"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "LICENSE"
      - "LICENSE-POLYFORM"
      - "LICENSE.md"
      - "NOTICE"
      - "infra/compose/docker-compose.images.yml"
      - "infra/compose/.env.images.example"
      - "docs/licensing-faq.md"
      - "docs/commercial-license.md"
      - "docs/licensing-rollout.md"
      - "docs/cla/v1.md"
      - "packages/ui-tokens/**"

permissions:
  contents: read

concurrency:
  group: desktop-tauri-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-build:
    if: >-
      github.event_name != 'release' ||
      (startsWith(github.event.release.tag_name, 'v') &&
      (github.event.release.prerelease == false || contains(github.event.release.tag_name, '-beta.')))
    name: Tauri (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ORKBOT_ENABLE_AUTO_UPDATE: "0"
      ORK_ACCOUNTS_ISSUER: https://api.orkbot.run
      ORK_ACCOUNTS_DESKTOP_CLIENT_ID: ${{ vars.ORK_ACCOUNTS_DESKTOP_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'release' && '[{"os":"macos-26","platform":"darwin-aarch64"},{"os":"macos-26-intel","platform":"darwin-x86_64"},{"os":"ubuntu-22.04","platform":"linux-x86_64"}]' || '[{"os":"macos-26","platform":"darwin-aarch64"},{"os":"macos-26-intel","platform":"darwin-x86_64"},{"os":"windows-2022","platform":"windows-x86_64"},{"os":"ubuntu-22.04","platform":"linux-x86_64"}]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux WebView and packaging dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Keep the runner's signed Ubuntu sources while bypassing its slow Azure mirror.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libxdo-dev
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: pnpm install --frozen-lockfile
      - name: Run native unit tests
        run: pnpm --filter @orkbot/desktop tauri:test
      - name: Check native code
        run: pnpm --filter @orkbot/desktop tauri:check
      - name: Test Windows signing helpers offline
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --test apps/desktop/scripts/windows-distribution.test.mjs
          node --test .github/scripts/prepare-windows-signing-tools.test.mjs
      - name: Parse Windows signing script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'apps/desktop/scripts/windows-distribution.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'Windows signing script has invalid syntax.' }
      - name: Prepare verified Windows signing tools
        if: runner.os == 'Windows'
        run: node .github/scripts/prepare-windows-signing-tools.mjs
      - name: Check Windows signing tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const { spawnSync } = require("node:child_process");
            for (const name of ["WINDOWS_SIGNTOOL_PATH", "WINDOWS_SIGNING_DLIB_PATH"]) {
              if (!process.env[name] || !fs.statSync(process.env[name]).isFile()) throw new Error("Windows signing tools are unavailable.");
            }
            const result = spawnSync(process.env.WINDOWS_SIGNTOOL_PATH, ["/?"], { encoding: "utf8", timeout: 30000, windowsHide: true });
            if (result.error || ![0, 1].includes(result.status) || !/Usage:\s+signtool\b/i.test(result.stdout + result.stderr)) {
              throw new Error("Windows SignTool could not run.");
            }
            console.log("SignTool help exit code:", result.status);
          '
      - name: Configure Linux WebKit helpers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          jq -n '{bundle:{linux:{appimage:{files:{"/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1":"/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1"}}}}}' > "$RUNNER_TEMP/linux-webkit.json"
      - name: Prepare verified packaging tools
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test .github/scripts/prepare-tauri-tools.test.mjs
          node .github/scripts/prepare-tauri-tools.mjs
      - name: Build diagnostic installers
        if: github.event_name != 'release'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            pnpm --filter @orkbot/desktop tauri:build --verbose --config "$RUNNER_TEMP/linux-webkit.json"
          else
            pnpm --filter @orkbot/desktop tauri:build
          fi
      - name: Build signed updates
        if: >-
          github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') &&
          (github.event.release.prerelease == false || contains(github.event.release.tag_name, '-beta.'))
        shell: bash
        env:
          ORKBOT_ENABLE_AUTO_UPDATE: "1"
          TAURI_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/desktop-stable/latest.json
          TAURI_UPDATER_BETA_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/desktop-beta/latest.json
          TAURI_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_RELEASE_PLATFORM: ${{ matrix.platform }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_PRIVATE_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_PRIVATE_KEY || '' }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          if [[ "$RUNNER_OS" == macOS ]]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/ork-notarization-key.p8"
            trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
            node apps/desktop/scripts/macos-distribution.ts prepare "$APPLE_API_KEY_PATH"
          fi
          node apps/desktop/scripts/tauri-release.ts prepare "$RUNNER_TEMP/tauri-release.json"
          if [[ "$RUNNER_OS" == Linux ]]; then
            jq -s '.[0] * .[1]' "$RUNNER_TEMP/tauri-release.json" "$RUNNER_TEMP/linux-webkit.json" > "$RUNNER_TEMP/linux-release.json"
            mv "$RUNNER_TEMP/linux-release.json" "$RUNNER_TEMP/tauri-release.json"
          fi
          case "$RUNNER_OS" in
            macOS) bundles="app,dmg" ;;
            Windows) bundles="nsis" ;;
            Linux) bundles="appimage" ;;
          esac
          if [[ "$RUNNER_OS" == Linux ]]; then
            pnpm --filter @orkbot/desktop tauri:build --verbose --bundles "$bundles" --config "$RUNNER_TEMP/tauri-release.json"
          else
            pnpm --filter @orkbot/desktop tauri:build --bundles "$bundles" --config "$RUNNER_TEMP/tauri-release.json"
          fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            node apps/desktop/scripts/macos-distribution.ts verify apps/desktop/src-tauri/target/release/bundle
          fi
          node apps/desktop/scripts/tauri-release.ts stage apps/desktop/src-tauri/target/release/bundle "$RUNNER_TEMP/updater"
      - name: Upload signed update artifacts
        if: >-
          github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') &&
          (github.event.release.prerelease == false || contains(github.event.release.tag_name, '-beta.'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ork-tauri-updater-${{ matrix.platform }}
          path: ${{ runner.temp }}/updater/
          if-no-files-found: error
          retention-days: 14
      - name: Record installer sizes
        shell: bash
        run: >-
          node apps/desktop/scripts/tauri-metrics.mjs apps/desktop/src-tauri/target/release/bundle
          > "$RUNNER_TEMP/tauri-artifact-sizes.json"
      - name: Upload installers and size report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ork-tauri-build-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/release/bundle/**/*.tar.gz
            ${{ runner.temp }}/tauri-artifact-sizes.json
          if-no-files-found: error
          retention-days: 7
  windows-signed-release:
    if: >-
      github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') &&
      (github.event.release.prerelease == false || contains(github.event.release.tag_name, '-beta.'))
    name: Signed Windows release
    runs-on: windows-2022
    environment: desktop-windows-signing
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ORKBOT_ENABLE_AUTO_UPDATE: "1"
      ORK_ACCOUNTS_ISSUER: https://api.orkbot.run
      ORK_ACCOUNTS_DESKTOP_CLIENT_ID: ${{ vars.ORK_ACCOUNTS_DESKTOP_CLIENT_ID }}
      WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
      WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
    steps:
      - name: Validate signing configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in WINDOWS_SIGNING_ENDPOINT WINDOWS_SIGNING_ACCOUNT WINDOWS_SIGNING_PROFILE AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing required signing configuration: %s\n' "$name" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: pnpm install --frozen-lockfile
      - name: Run native unit tests
        run: pnpm --filter @orkbot/desktop tauri:test
      - name: Check native code
        run: pnpm --filter @orkbot/desktop tauri:check
      - name: Prepare verified packaging tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test .github/scripts/prepare-tauri-tools.test.mjs
          node .github/scripts/prepare-tauri-tools.mjs
      - name: Prepare verified Windows signing tools
        shell: bash
        run: |
          node --test .github/scripts/prepare-windows-signing-tools.test.mjs
          node .github/scripts/prepare-windows-signing-tools.mjs
      - name: Prepare Windows signing configuration
        shell: bash
        env:
          WINDOWS_SIGNING_RECORD_PATH: ${{ runner.temp }}/windows-signing-record.json
        run: |
          printf 'WINDOWS_SIGNING_RECORD_PATH=%s\n' "$WINDOWS_SIGNING_RECORD_PATH" >> "$GITHUB_ENV"
          node apps/desktop/scripts/windows-distribution.ts prepare "$RUNNER_TEMP/windows-signing.json" "$RUNNER_TEMP/windows-metadata.json"
      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and verify signed Windows update
        shell: bash
        env:
          TAURI_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/desktop-stable/latest.json
          TAURI_UPDATER_BETA_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/desktop-beta/latest.json
          TAURI_RELEASE_TAG: ${{ github.event.release.tag_name }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_RELEASE_PLATFORM: windows-x86_64
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/windows-signing.json" "$RUNNER_TEMP/windows-metadata.json" "$WINDOWS_SIGNING_RECORD_PATH"' EXIT
          node apps/desktop/scripts/tauri-release.ts prepare "$RUNNER_TEMP/tauri-release.json"
          jq -s '.[0] * .[1]' "$RUNNER_TEMP/tauri-release.json" "$RUNNER_TEMP/windows-signing.json" > "$RUNNER_TEMP/windows-release.json"
          pnpm --filter @orkbot/desktop tauri:build --bundles nsis --config "$RUNNER_TEMP/windows-release.json"
          node apps/desktop/scripts/windows-distribution.ts verify apps/desktop/src-tauri/target/release/bundle apps/desktop/src-tauri/target/release/orkbot-desktop-preview.exe
          node apps/desktop/scripts/tauri-release.ts stage apps/desktop/src-tauri/target/release/bundle "$RUNNER_TEMP/updater"
      - name: Remove Windows signing metadata
        if: always()
        shell: powershell
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP/windows-signing.json", "$env:RUNNER_TEMP/windows-metadata.json", $env:WINDOWS_SIGNING_RECORD_PATH -Force -ErrorAction SilentlyContinue
      - name: Upload signed update artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ork-tauri-updater-windows-x86_64
          path: ${{ runner.temp }}/updater/
          if-no-files-found: error
          retention-days: 14
      - name: Record installer sizes
        shell: bash
        run: >-
          node apps/desktop/scripts/tauri-metrics.mjs apps/desktop/src-tauri/target/release/bundle
          > "$RUNNER_TEMP/tauri-artifact-sizes.json"
      - name: Upload installers and size report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ork-tauri-build-windows-x86_64-${{ github.run_id }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            ${{ runner.temp }}/tauri-artifact-sizes.json
          if-no-files-found: error
          retention-days: 7
  publish-release:
    if: >-
      github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') &&
      (github.event.release.prerelease == false || contains(github.event.release.tag_name, '-beta.'))
    needs: [diagnostic-build, windows-signed-release]
    concurrency:
      group: desktop-tauri-release-publish
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_RELEASE_TAG: ${{ github.event.release.tag_name }}
      CANDIDATE_SHA: ${{ github.sha }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Publish verified desktop release
        run: node .github/scripts/publish-tauri-release.mjs
