name: publish Playwright report

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  result:
    name: Read Playwright result
    if: >-
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      job_result: ${{ steps.playwright.outputs.job_result }}
      result: ${{ steps.playwright.outputs.result }}
    steps:
      - name: Read Playwright job result
        id: playwright
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          result="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" | \
            jq -r '[.[].jobs[] | select(.name == "Web E2E / Web E2E") | .conclusion] | unique | if length == 1 then .[0] else error("expected exactly one Playwright job") end')"
          case "$result" in
            success|failure) ;;
            timed_out) ;;
            # Pull requests that cannot affect the browser skip E2E; there is nothing to publish.
            skipped) ;;
            *) echo "Unexpected Playwright job conclusion: $result" >&2; exit 1 ;;
          esac
          echo "job_result=$result" >> "$GITHUB_OUTPUT"
          if [[ "$result" == "timed_out" ]]; then result="failure"; fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

  publish:
    needs: result
    if: needs.result.outputs.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: playwright-publication
      cancel-in-progress: false
    steps:
      # workflow_run has repository secrets. Always use trusted default-branch code here;
      # never check out or execute the contributor's pull-request revision.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check optional screenshot storage
        id: storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          PLAYWRIGHT_PUBLIC_BASE_URL: ${{ vars.PLAYWRIGHT_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          configured=false
          if [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" &&
                -n "$S3_BUCKET" && -n "$S3_ENDPOINT" && -n "$PLAYWRIGHT_PUBLIC_BASE_URL" ]]; then
            configured=true
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.storage.outputs.configured == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.storage.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.storage.outputs.configured == 'true'
      - name: Resolve pull request
        id: pull_request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          pulls="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${HEAD_OWNER}:${HEAD_BRANCH}&per_page=100")"
          number="$(jq -r --arg sha "$HEAD_SHA" \
            '[.[] | select(.head.sha == $sha)] | if length == 1 then .[0].number else empty end' \
            <<<"$pulls")"
          if [[ -z "$number" ]]; then
            echo "::warning::Could not resolve a pull request for ${HEAD_OWNER}:${HEAD_BRANCH} at ${HEAD_SHA}."
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Check for Playwright artifact
        id: artifact
        env:
          ARTIFACT_NAME: playwright-artifacts-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_JOB_RESULT: ${{ needs.result.outputs.job_result }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          artifacts="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=${ARTIFACT_NAME}")"
          count="$(jq --arg name "$ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
            <<<"$artifacts")"
          if [[ "$count" == "1" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "id=$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .id' <<<"$artifacts")" >> "$GITHUB_OUTPUT"
          elif [[ "$count" == "0" && ("$PLAYWRIGHT_JOB_RESULT" == "timed_out" || "$PLAYWRIGHT_JOB_RESULT" == "failure") ]]; then
            echo "::warning::The Playwright job ended before it uploaded an artifact. Linking the workflow run."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Expected exactly one unexpired Playwright artifact; found $count." >&2
            exit 1
          fi
      - name: Download Playwright artifacts
        if: steps.storage.outputs.configured == 'true' && steps.artifact.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/playwright-artifacts.zip"
          # Keep untrusted files outside the checkout, dependencies, configuration,
          # and generated dashboard consumed by the comment step.
          python3 scripts/extract-playwright-artifacts.py \
            "$RUNNER_TEMP/playwright-artifacts.zip" "$RUNNER_TEMP/playwright-artifacts"
      - name: Publish trusted Playwright screenshot gallery
        id: publish
        if: steps.storage.outputs.configured == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          AWS_EC2_METADATA_DISABLED: "true"
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          PLAYWRIGHT_PUBLIC_BASE_URL: ${{ vars.PLAYWRIGHT_PUBLIC_BASE_URL }}
          PLAYWRIGHT_RESULT: ${{ needs.result.outputs.result }}
          PLAYWRIGHT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PLAYWRIGHT_RUN_ID: ${{ github.event.workflow_run.id }}
          PLAYWRIGHT_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          PLAYWRIGHT_RUN_URL: ${{ github.event.workflow_run.html_url }}
          PLAYWRIGHT_SHA: ${{ github.event.workflow_run.head_sha }}
          PLAYWRIGHT_EVENT: ${{ github.event.workflow_run.event }}
          PLAYWRIGHT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PLAYWRIGHT_PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          PLAYWRIGHT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          PLAYWRIGHT_PUBLISH_REPORT: "false"
          PLAYWRIGHT_REPORT_DIR: ${{ runner.temp }}/playwright-artifacts/playwright-report
          PLAYWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/playwright-artifacts/apps/web/test-results
        run: bash scripts/publish-playwright-report.sh
      - name: Link screenshot gallery from pull request
        if: >-
          steps.storage.outputs.configured == 'true' &&
          steps.pull_request.outputs.number != '' &&
          steps.publish.outputs.latest_pr_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_PUBLIC_BASE_URL: ${{ vars.PLAYWRIGHT_PUBLIC_BASE_URL }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "PR_NUMBER must be a positive integer." >&2
            exit 1
          fi
          public_base_url="${PLAYWRIGHT_PUBLIC_BASE_URL%/}"
          gallery_url="$public_base_url/prs/$PR_NUMBER/index.html"
          review_path="$GITHUB_WORKSPACE/.tmp/playwright-dashboard/screenshots/review.json"
          if [[ ! -f "$review_path" ]]; then
            echo "Missing Playwright review manifest at $review_path." >&2
            exit 1
          fi
          changed_paths_file="$(mktemp)"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "$changed_paths_file"
          body="$(
            PLAYWRIGHT_GALLERY_URL="$gallery_url" \
            PLAYWRIGHT_DASHBOARD_URL="$public_base_url/index.html" \
            PLAYWRIGHT_RUN_URL="$RUN_URL" \
            PLAYWRIGHT_SHA="$SHA" \
              pnpm exec tsx packages/testkit/src/cli/build-playwright-pr-screenshot-comment.ts \
                "$review_path" \
                "$changed_paths_file"
          )"
          marker="<!-- orkbot-playwright-screenshots -->"
          comment_id="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" | \
            jq -r --arg marker "$marker" \
              '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))] | last | .id // empty')"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input - <<<"$payload"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - <<<"$payload"
          fi
      - name: Link native Actions report and screenshots
        if: steps.storage.outputs.configured != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
          HAS_ARTIFACT: ${{ steps.artifact.outputs.exists }}
          PLAYWRIGHT_RESULT: ${{ needs.result.outputs.result }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body_path="$RUNNER_TEMP/playwright-artifact-comment.md"
          {
            printf '<!-- orkbot-playwright-screenshots -->\n\n'
            printf 'Playwright: **%s** for `%s`.\n\n' "$PLAYWRIGHT_RESULT" "$SHA"
            if [[ "$HAS_ARTIFACT" == true ]]; then
              [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid artifact ID." >&2; exit 1; }
              artifact_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts/$ARTIFACT_ID"
              printf '[Download report and screenshots](%s)\n\n' "$artifact_url"
            else
              printf 'The test job ended before it uploaded a report artifact.\n\n'
            fi
            printf '[Workflow run](%s)\n' "$RUN_URL"
          } > "$body_path"
          cat "$body_path" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$PR_NUMBER" ]]; then exit 0; fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid pull request number." >&2; exit 1; }
          marker="<!-- orkbot-playwright-screenshots -->"
          comment_id="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" | \
            jq -r --arg marker "$marker" \
              '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))] | last | .id // empty')"
          payload_path="$RUNNER_TEMP/playwright-artifact-comment.json"
          jq -n --rawfile body "$body_path" '{body: $body}' > "$payload_path"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input "$payload_path"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input "$payload_path"
          fi
