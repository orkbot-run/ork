name: release-android-apk

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic Actions artifact or configured EAS production release
        type: choice
        options: [diagnostic, eas]
        default: diagnostic
  workflow_call:
    inputs:
      mode:
        type: string
        default: diagnostic

permissions:
  contents: read

concurrency:
  group: release-android-apk
  cancel-in-progress: false

jobs:
  configuration:
    name: Check Android release configuration
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Validate selected Android build mode
        id: mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          RELEASE_REF: ${{ github.ref }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EXPO_OWNER: ${{ vars.EXPO_OWNER }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          mode="${REQUESTED_MODE:-diagnostic}"
          case "$mode" in
            diagnostic)
              echo "Android diagnostic APK selected. GitHub builds it locally with development signing and uploads an Actions artifact. Expo, Firebase push, store submission, and production signing are not configured by this mode." >> "$GITHUB_STEP_SUMMARY"
              ;;
            eas)
              [[ "$RELEASE_REF" == refs/heads/main ]] || { echo "EAS releases must run from main." >&2; exit 1; }
              missing=()
              for name in EXPO_TOKEN EXPO_PROJECT_ID EXPO_OWNER EXPO_PUBLIC_API_URL; do
                [[ -n "${!name}" ]] || missing+=("$name")
              done
              if (( ${#missing[@]} )); then
                echo "EAS release requires configured Ork credentials and repository variables: ${missing[*]}" >&2
                exit 1
              fi
              [[ "$EXPO_PROJECT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "EXPO_PROJECT_ID must be the Ork project's UUID." >&2; exit 1; }
              [[ "$EXPO_PUBLIC_API_URL" == https://* ]] || { echo "EXPO_PUBLIC_API_URL must use HTTPS for production." >&2; exit 1; }
              echo "Configured EAS production build selected. The project's own Android keystore and Firebase configuration are required." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "Unknown Android mode: $mode" >&2; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  diagnostic:
    name: Build diagnostic Android APK on GitHub
    needs: configuration
    if: needs.configuration.outputs.mode == 'diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://127.0.0.1:3100' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
      - run: pnpm install --frozen-lockfile
      - name: Generate local Android project
        run: pnpm --filter @orkbot/mobile exec expo prebuild --platform android --no-install
      - name: Build development-signed standalone APK
        working-directory: apps/mobile/android
        run: >-
          ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a
          --no-daemon --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ork-android-diagnostic-arm64-${{ github.run_id }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build and publish the Android APK
    needs: configuration
    if: github.ref == 'refs/heads/main' && needs.configuration.outputs.mode == 'eas'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: android
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Bind the runner checkout to the configured Ork Expo project
        env:
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EXPO_OWNER: ${{ vars.EXPO_OWNER }}
        run: |
          jq --arg project "$EXPO_PROJECT_ID" --arg owner "$EXPO_OWNER" \
            '.expo.owner = $owner | .expo.extra.eas.projectId = $project | .expo.updates.enabled = true | .expo.updates.url = ("https://u.expo.dev/" + $project)' \
            apps/mobile/app.json > "$RUNNER_TEMP/ork-mobile-app.json"
          cp "$RUNNER_TEMP/ork-mobile-app.json" apps/mobile/app.json
          jq --arg api "$EXPO_PUBLIC_API_URL" '.build.production.env.EXPO_PUBLIC_API_URL = $api' \
            apps/mobile/eas.json > "$RUNNER_TEMP/ork-mobile-eas.json"
          cp "$RUNNER_TEMP/ork-mobile-eas.json" apps/mobile/eas.json

      - name: Require Expo automation token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "Add an EXPO_TOKEN repository secret with access to the configured Ork Expo project." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Set up Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify mobile project
        run: pnpm --filter @orkbot/mobile check

      # Without Firebase config the APK never registers for push, and an OTA update can't add it.
      - name: Require Firebase config
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          vars="$(eas env:list production --format short)"
          if ! grep -q '^GOOGLE_SERVICES_JSON=' <<< "$vars"; then
            echo "Set the GOOGLE_SERVICES_JSON file variable in the EAS production environment (see docs/mobile-release.md)." >&2
            exit 1
          fi

      # EAS signs with the project's managed Android keystore and bakes in the production update
      # channel, so installed APKs receive the same OTA updates as store builds.
      - name: Build APK on EAS
        id: build
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          eas build --platform android --profile android-apk --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          url="$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl' "$RUNNER_TEMP/build.json")"
          version="$(jq -r '.[0].appVersion' "$RUNNER_TEMP/build.json")"
          version_code="$(jq -r '.[0].appBuildVersion' "$RUNNER_TEMP/build.json")"
          if [[ -z "$url" || "$url" == "null" || "$url" != https://* ]]; then
            echo "EAS did not return an APK download URL." >&2
            exit 1
          fi
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/orkbot.apk" "$url"
          if [[ "$(head -c 2 "$RUNNER_TEMP/orkbot.apk")" != "PK" ]]; then
            echo "The downloaded artifact is not an APK." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      # One rolling release keeps a stable download URL:
      # https://github.com/<owner>/<repo>/releases/download/android/orkbot.apk
      # It never becomes GitHub's "latest" release, which the desktop updater reads. An existing
      # release is updated in place: the new APK is uploaded under a temporary name before the old
      # one is removed, so a failed run leaves the previous download working.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
        run: |
          set -euo pipefail
          title="Ork for Android $VERSION ($VERSION_CODE)"
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null 2> "$RUNNER_TEMP/view.err"; then
            if ! grep -q "release not found" "$RUNNER_TEMP/view.err"; then
              cat "$RUNNER_TEMP/view.err" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/orkbot.apk" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "Install orkbot.apk on your Android phone. It updates itself over the air." \
              --latest=false
            exit 0
          fi

          staged="orkbot-$VERSION_CODE.apk"
          cp "$RUNNER_TEMP/orkbot.apk" "$RUNNER_TEMP/$staged"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$staged" --clobber
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets')"
          staged_id="$(jq -r --arg name "$staged" '.[] | select(.name == $name) | .id' <<< "$assets")"
          old_id="$(jq -r '.[] | select(.name == "orkbot.apk") | .id' <<< "$assets")"
          if [[ -z "$staged_id" ]]; then
            echo "The uploaded $staged is missing from the release; leaving the previous APK in place." >&2
            exit 1
          fi
          if [[ -n "$old_id" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id"
          fi
          for attempt in 1 2 3; do
            if gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$staged_id" -f name=orkbot.apk > /dev/null; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Could not rename $staged to orkbot.apk; rename it on the release page." >&2
              exit 1
            fi
            sleep 5
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          gh release edit "$RELEASE_TAG" --title "$title" --latest=false
