# Inherited Android orchestration is preserved; native iOS builds use GitHub Actions and Xcode.

name: release-mobile

env:
  ORK_ACCOUNTS_ISSUER: ${{ vars.ORK_ACCOUNTS_ISSUER || 'https://api.ork.run' }}
  ORK_ACCOUNTS_MOBILE_CLIENT_ID: ${{ vars.ORK_ACCOUNTS_MOBILE_CLIENT_ID }}

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build a signed iOS IPA on GitHub Actions without uploading it
        type: boolean
        default: true
      submit_ios:
        description: Also upload the verified iOS build to App Store Connect from main
        type: boolean
        default: false
      android_mode:
        description: Android build mode
        type: choice
        options: [diagnostic, eas]
        default: diagnostic
      notes:
        description: Optional notes retained with the IPA; App Review is submitted separately
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-mobile
  cancel-in-progress: false

jobs:
  configuration:
    name: Check mobile release configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Check iOS configuration without contacting Apple
        env:
          BUILD_IOS: ${{ inputs.build_ios }}
          SUBMIT_IOS: ${{ inputs.submit_ios }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          IOS_DEVELOPMENT_CERTIFICATE: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE }}
          IOS_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: node .github/scripts/ios-release.mjs check

  ios:
    name: Build signed iOS IPA
    needs: configuration
    if: inputs.build_ios || inputs.submit_ios
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
      # Reuse app.config.ts production validation without requiring an EAS account.
      EAS_BUILD_PROFILE: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify Xcode and install native Rust compiler
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -E '^Xcode (27\.[1-9]|2[89]\.|[3-9][0-9]\.)'
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test release controls
        run: node --test .github/scripts/app-store-review.test.mjs
      - name: Verify mobile project
        run: pnpm --filter @orkbot/mobile check
      - name: Generate native iOS project and installation transport
        run: pnpm --filter @orkbot/mobile exec expo prebuild --platform ios --no-install
      - name: Install native pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Archive, export and verify iOS; upload only when explicitly requested
        env:
          BUILD_IOS: ${{ inputs.build_ios }}
          SUBMIT_IOS: ${{ inputs.submit_ios }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          IOS_DEVELOPMENT_CERTIFICATE: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE }}
          IOS_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node .github/scripts/ios-release.mjs build
      - name: Remove temporary iOS signing material
        if: always()
        run: node .github/scripts/ios-release.mjs cleanup
      - name: Upload verified iOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ork-ios-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ork-ios-artifacts/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    needs: configuration
    uses: ./.github/workflows/release-android-apk.yml
    with:
      mode: ${{ inputs.android_mode || 'diagnostic' }}
    permissions:
      contents: write
    secrets: inherit
