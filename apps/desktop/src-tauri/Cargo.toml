[package]
name = "orkbot-desktop-preview"
version = "1.0.0"
description = "Experimental Ork system WebView client"
license = "Apache-2.0 AND PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ork-installation-transport = { path = "../../../packages/client-transport/native" }
tauri = { version = "2", features = ["linux-libxdo"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "~2.14"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
zeroize = "1"
hmac = "0.12"
base64 = "0.22"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "net", "time", "process", "io-util"] }
tempfile = "3"
getrandom = "0.3"
dotenvy = "0.15"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15", "sync-keychain"] }
plist = "1.10.3"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebViewConfiguration", "WKUserContentController"] }

[dev-dependencies]
rsa = "0.9"
plist = "1.10.3"
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
