<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ork Preview</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main class="shell">
      <h1 class="heading">Ork Preview</h1>
      <section id="signed-out">
        <button id="sign-in" class="button button-primary" type="button" disabled>Sign in to Accounts</button>
      </section>
      <section id="signed-in" hidden>
        <div class="account-row">
          <span id="account"></span>
          <button id="sign-out" class="link" type="button">Sign out</button>
        </div>
        <section id="servers" class="server-list" aria-label="Your servers"></section>
        <button id="refresh" class="link" type="button">Refresh</button>
        <details id="add-server" class="headers">
          <summary>Add server</summary>
      <form id="setup">
        <fieldset class="choices">
          <legend class="sr-only">Instance</legend>
          <label class="choice"><input type="radio" name="mode" value="existing" checked /><span class="choice-title">Existing instance</span></label>
          <label class="choice"><input type="radio" name="mode" value="new" /><span class="choice-title">This computer</span></label>
        </fieldset>
        <section id="existing-server">
        <label class="field-label" for="server-url">Server address</label>
        <input id="server-url" class="field" type="text" spellcheck="false" autocomplete="off" placeholder="https://orkbot.example.com" required />
        </section>
        <details id="details" class="headers" hidden><summary>Technical details</summary><pre id="output" class="stack-output"></pre></details>
        <div class="actions">
          <button id="connect" class="button button-primary" type="submit" disabled>Connect</button>
        </div>
      </form>
        </details>
      </section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="actions"><button id="quit" class="button button-secondary" type="button">Quit</button></div>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
