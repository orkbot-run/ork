server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = / {
        types { }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/html;
        rewrite ^ /install.sh break;
    }

    location / {
        return 404;
    }
}
