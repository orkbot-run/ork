appId: run.orkbot.app
---
- runFlow: open-account.yaml
- tapOn: "Workspace,.*"
- runFlow:
    when:
      visible: "Set as default organization"
    commands:
      - tapOn: "Set as default organization"
- extendedWaitUntil:
    visible: "Default organization"
    timeout: 15000
- tapOn: "Cancel"
- runFlow: home.yaml
