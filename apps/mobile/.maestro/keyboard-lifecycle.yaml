appId: run.orkbot.app
name: Keyboard lifecycle regression
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

- runFlow: helpers/sign-in.yaml
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
# Make cold-start restoration explicit when the account belongs to several organizations.
- runFlow: helpers/set-default-organization.yaml
- runFlow: helpers/open-researcher.yaml
- extendedWaitUntil:
    visible: "Message Researcher"
    timeout: 15000
- tapOn: "Message Researcher"
- inputText: "Keyboard lifecycle check"
- pressKey: Enter
- inputText: "Second line"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-initial"
- pressKey: Home
- launchApp:
    stopApp: false
- tapOn: "Message Researcher"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-resumed"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- tapOn: "Researcher"
- extendedWaitUntil:
    visible: "Message Researcher"
    timeout: 15000
# The unsent draft survives a restart.
- tapOn: "Message Researcher"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-restarted"
- hideKeyboard
- runFlow: helpers/open-account.yaml
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- tapOn: "Sign out"
- runFlow: helpers/sign-in.yaml
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 15000
- runFlow: helpers/open-researcher.yaml
- extendedWaitUntil:
    visible: "Message Researcher"
    timeout: 15000
- assertNotVisible: 'Keyboard lifecycle check\nSecond line'
- tapOn: "Message Researcher"
- inputText: "Keyboard lifecycle check"
- pressKey: Enter
- inputText: "Second line"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-signed-in-again"
- hideKeyboard
