# Inherited native screenshot flows; Accounts updates follow LICENSE.md.

appId: run.orkbot.app
name: Managed organization and workspace directory
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- runFlow: helpers/sign-in.yaml
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- tapOn: "Account"
- tapOn: "Workspace,.*"
- assertVisible: "Organization"
- assertVisible: "Cancel"
- takeScreenshot: "40-account-workspace-directory"
- tapOn: "Organization"
- assertVisible: ${ORKBOT_SCREENSHOT_ORGANIZATION}
- assertVisible: ${ORKBOT_SCREENSHOT_OTHER_ORGANIZATION}
- takeScreenshot: "41-organization-menu"
- tapOn: ${ORKBOT_SCREENSHOT_OTHER_ORGANIZATION}
- extendedWaitUntil:
    visible: ${ORKBOT_SCREENSHOT_OTHER_WORKSPACE}
    timeout: 15000
- takeScreenshot: "42-company-workspace-directory"
- tapOn: ${ORKBOT_SCREENSHOT_OTHER_WORKSPACE}
- extendedWaitUntil:
    visible: "Continue with Ork Accounts|Create"
    timeout: 30000
- runFlow:
    when:
      visible: "Continue with Ork Accounts"
    commands:
      - tapOn: "Continue with Ork Accounts"
- extendedWaitUntil:
    visible: "Create"
    timeout: 30000
- assertVisible: ${ORKBOT_SCREENSHOT_OTHER_WORKSPACE}
- assertNotVisible: "Researcher"
- takeScreenshot: "43-company-workspace-inbox"
# Warm VIEW intents must preserve the admitted workspace during foreground verification.
- openLink: "orkbot:///new-group"
- extendedWaitUntil:
    visible: "Search bots"
    timeout: 15000
- takeScreenshot: "43b-company-warm-new-group"
- openLink: "orkbot:///account"
- extendedWaitUntil:
    visible: "Workspace,.*"
    timeout: 15000
- assertVisible: ${ORKBOT_SCREENSHOT_OTHER_ORGANIZATION}
- runFlow: helpers/open-account.yaml
- tapOn: "Workspace,.*"
- tapOn: "Organization"
- tapOn: ${ORKBOT_SCREENSHOT_ORGANIZATION}
- extendedWaitUntil:
    visible: "Continue with Ork Accounts|Create"
    timeout: 30000
- runFlow:
    when:
      visible: "Continue with Ork Accounts"
    commands:
      - tapOn: "Continue with Ork Accounts"
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- assertVisible: ${ORKBOT_SCREENSHOT_WORKSPACE}
- takeScreenshot: "44-personal-workspace-restored"
- tapOn: "Account"
- tapOn: "Workspace,.*"
- tapOn: "Cancel"
- assertVisible: "Workspace,.*"
- back
- assertVisible: "Researcher"
- takeScreenshot: "45-workspace-picker-cancelled"
