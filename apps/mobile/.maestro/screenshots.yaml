# Inherited native screenshot flows; Accounts updates follow LICENSE.md.

appId: run.orkbot.app
name: Ork mobile screenshots
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

- extendedWaitUntil:
    visible: "Get started|Pixel Launcher isn't responding"
    timeout: 60000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 30000
- takeScreenshot: "02-welcome"
- tapOn: "Get started"
- takeScreenshot: "01-accounts-start"
- runFlow: helpers/sign-in.yaml
# The account has several organizations; choose the default through its real settings.
- runFlow: helpers/set-default-organization.yaml
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- takeScreenshot: "04-inbox"

- tapOn: "Activity"
# The fixture's bot replies arrive unread, so Activity always has its Unread section.
- extendedWaitUntil:
    visible: "Unread"
    timeout: 10000
- takeScreenshot: "05-activity"

- tapOn:
    id: "home-search-button"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "search-sheet-field"
    commands:
      - tapOn: "Search"
- tapOn:
    id: "search-sheet-field"
- inputText: "fixture"
- hideKeyboard
- extendedWaitUntil:
    visible: "Weekly fixture review"
    timeout: 10000
- takeScreenshot: "06-search-results"
- tapOn:
    id: "search-sheet-close"
- tapOn: "Activity"

- runFlow: helpers/home.yaml
- tapOn: "Create"
- tapOn: "New group chat"
- assertVisible: "Search bots"
- takeScreenshot: "08-new-group"

- runFlow: helpers/open-account.yaml
- extendedWaitUntil:
    visible: "Workspace,.*"
    timeout: 10000
- tapOn: "Workspace,.*"
- assertVisible: "Organization"
- takeScreenshot: "09-workspace-directory"
- tapOn: "Cancel"

- runFlow: helpers/open-account.yaml
- extendedWaitUntil:
    visible: "Workspace,.*"
    timeout: 10000
- takeScreenshot: "10-account"
- scrollUntilVisible:
    element: "Notification settings"
    direction: DOWN
- takeScreenshot: "10c-account-notifications"

- runFlow:
    file: helpers/open-setting.yaml
    env:
      SETTING: "Models"
- extendedWaitUntil:
    visible: "Models and limits"
    timeout: 10000
- assertVisible: "Enabled"
- assertVisible: "Default"
- takeScreenshot: "11-models"

- runFlow:
    file: helpers/open-setting.yaml
    env:
      SETTING: "Voice"
- extendedWaitUntil:
    visible: "Scripted"
    timeout: 10000
- takeScreenshot: "12-voice"

- runFlow:
    file: helpers/open-setting.yaml
    env:
      SETTING: "Integrations"
- extendedWaitUntil:
    visible: "Search apps"
    timeout: 10000
- takeScreenshot: "13-integrations"
- tapOn: "Add custom"
- tapOn: "MCP server"
- extendedWaitUntil:
    visible: "Remote MCP server"
    timeout: 10000
- takeScreenshot: "14-integrations-advanced"

- runFlow: helpers/open-researcher.yaml
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 10000
- assertNotVisible: "Reply"
- assertNotVisible: "React"
- assertNotVisible: "More"
- takeScreenshot: "15-thread"
- assertVisible:
    id: "peer-receipt-line"
- assertNotVisible: "Update from Writer: The fixture launch note is drafted."
- takeScreenshot: "15e-thread-peer-folded"
- tapOn:
    id: "peer-receipt-line"
- assertVisible: "Draft the fixture launch note."
- assertVisible: "Close"
- takeScreenshot: "15f-thread-peer-chat"
- tapOn: "Close"
- tapOn: "Message Researcher"
- inputText: "Keyboard visibility check"
- assertVisible: "Keyboard visibility check"
- assertVisible: "Send"
- takeScreenshot: "15d-thread-keyboard"
- pressKey: Enter
- inputText: "Second line"
- assertVisible: 'Keyboard visibility check\nSecond line'
- hideKeyboard
- assertVisible: 'Keyboard visibility check\nSecond line'
- tapOn: "Message Researcher"
- assertVisible: 'Keyboard visibility check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "15g-thread-keyboard-reopened"
- longPressOn: "Message Researcher"
- tapOn: "Select all"
- eraseText: 1
- assertNotVisible: 'Keyboard visibility check\nSecond line'
- hideKeyboard
# Holding a message opens the reaction row and grouped actions next to it.
- longPressOn: "The fixture workspace is ready."
- assertVisible: "Reply"
- assertVisible: "👍"
- assertVisible: "Speak message"
- takeScreenshot: "15b-message-actions"
- back
# Wait for the action menu to finish closing before the next message.
- waitForAnimationToEnd
# User messages omit Speak.
- longPressOn: "Summarize the fixture launch checklist."
- assertVisible: "Reply"
- assertVisible: "👍"
- assertVisible: "Copy"
- assertNotVisible: "Speak message"
- tapOn: "Reply"
- assertVisible: "Cancel reply"
- tapOn: "Cancel reply"
# Bot actions live in the bot's profile header.
- runFlow: helpers/open-profile.yaml
- extendedWaitUntil:
    visible: "Bot actions"
    timeout: 10000
- tapOn: "Bot actions"
- assertVisible: "Clear conversation"
- takeScreenshot: "16-bot-actions"
- back

- runFlow: helpers/open-profile.yaml
- tapOn: "Edit"
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 10000
- assertVisible: "Advanced"
- tapOn: "Advanced"
- assertVisible: "Model"
# The label includes the resolved workspace model.
- assertVisible: "Space default.*"
- takeScreenshot: "17-bot-settings"

- runFlow: helpers/open-profile.yaml
- scrollUntilVisible:
    element: "Computer"
    direction: DOWN
- tapOn: "Computer"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 10000
- takeScreenshot: "18-computer"

- runFlow: helpers/open-group.yaml
- extendedWaitUntil:
    visible: "The fixture launch plan is ready."
    timeout: 10000
- assertNotVisible: "Reply"
- assertNotVisible: "React"
- assertNotVisible: "More"
- takeScreenshot: "19-group-thread"
- tapOn: "Message Launch team"
- inputText: "Group keyboard visibility check"
- assertVisible: "Group keyboard visibility check"
- assertVisible: "Send"
- takeScreenshot: "19b-group-thread-keyboard"
- eraseText
- hideKeyboard
- longPressOn: "The fixture launch plan is ready."
- assertVisible: "Reply"
- assertVisible: "👍"
- assertVisible: "Speak message"
- back

- runFlow: helpers/open-group.yaml
- tapOn:
    text: "Group settings"
    index: 0
- extendedWaitUntil:
    visible: "Delete group"
    timeout: 10000
- takeScreenshot: "20-group-settings"

- runFlow: helpers/open-profile.yaml
- tapOn: "Routines"
- tapOn: "Weekly fixture review"
- extendedWaitUntil:
    visible: "Weekly fixture review"
    timeout: 10000
- takeScreenshot: "21-routine"

# Verify saved appearance changes on already-mounted screens and modal routes.
- runFlow: helpers/open-account.yaml
- extendedWaitUntil:
    visible: "Dark"
    timeout: 10000
- tapOn: "Dark"
- takeScreenshot: "22-account-dark"
- scrollUntilVisible:
    element: "Notification settings"
    direction: DOWN
- takeScreenshot: "22b-account-notifications-dark"

- runFlow: helpers/home.yaml
- tapOn: "Create"
- tapOn: "New group chat"
- assertVisible: "Search bots"
- takeScreenshot: "24-new-group-dark"

- runFlow: helpers/open-account.yaml
- extendedWaitUntil:
    visible: "Workspace,.*"
    timeout: 10000
- tapOn: "Workspace,.*"
- assertVisible: "Organization"
- takeScreenshot: "25-workspace-directory-dark"
- tapOn: "Cancel"

- runFlow: helpers/open-researcher.yaml
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 10000
- takeScreenshot: "26-thread-dark"

- runFlow: helpers/open-group.yaml
- extendedWaitUntil:
    visible: "The fixture launch plan is ready."
    timeout: 10000
- takeScreenshot: "27-group-thread-dark"

- runFlow: helpers/open-group.yaml
- tapOn:
    text: "Group settings"
    index: 0
- assertVisible: "Delete group"
- takeScreenshot: "28-group-settings-dark"

- runFlow: helpers/open-account.yaml
- tapOn: "Light"
- runFlow: helpers/open-researcher.yaml
- assertVisible: "The fixture workspace is ready."
- takeScreenshot: "29-thread-light-restored"

# Capture the reaction after theme comparisons. Reactions are append-only, so adding
# 👍 earlier would leak into dark/light thread frames with no remove control.
- longPressOn: "The fixture workspace is ready."
- tapOn: "👍"
- extendedWaitUntil:
    visible: "👍"
    timeout: 10000
- assertNotVisible: "Reply"
- takeScreenshot: "15c-message-reaction"
