appId: run.orkbot.app
name: Traditional Chinese language selection persists
# Run against a signed-in test account on an English device.
---
- launchApp
# Open language settings through the same account screen as a user.
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- runFlow:
    file: helpers/open-setting.yaml
    env:
      SETTING: "Language"
- extendedWaitUntil:
    visible: "Language"
    timeout: 10000
- assertVisible: "简体中文"
- tapOn: "繁體中文"
- assertVisible: "語言"
- takeScreenshot: "ui-locale-zh-tw"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- runFlow: helpers/home.yaml
- tapOn: "帳號"
- scrollUntilVisible:
    element: "語言"
    direction: DOWN
- tapOn: "語言"
- extendedWaitUntil:
    visible: "語言"
    timeout: 10000
- tapOn: "English"
- assertVisible: "Language"
