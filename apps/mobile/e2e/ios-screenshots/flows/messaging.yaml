appId: run.orkbot.app
name: Messaging
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ORKBOT_ACTIVE_EMAIL: ${ORKBOT_SCREENSHOT_EMAIL}
- openLink: "orkbot:///messaging"
- extendedWaitUntil:
    visible: ".*#launch.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-messaging
- tapOn: ".*#launch.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-team-conversation
