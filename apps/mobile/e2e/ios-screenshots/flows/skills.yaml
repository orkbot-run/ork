appId: run.orkbot.app
name: Skills
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ORKBOT_ACTIVE_EMAIL: ${ORKBOT_SCREENSHOT_EMAIL}
- openLink: "orkbot:///skills"
- extendedWaitUntil:
    visible: ".*Review Kit.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-skills
- tapOn: "Ork"
- extendedWaitUntil:
    visible: ".*name: Ork.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-skill
- tapOn: "Back"
- tapOn: ".*New skill.*"
- extendedWaitUntil:
    visible: "Save"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-new-skill
- openLink: "orkbot:///skills"
- tapOn: ".*Review Kit.*"
- extendedWaitUntil:
    visible: ".*Install.*|.*Add.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-plugin
