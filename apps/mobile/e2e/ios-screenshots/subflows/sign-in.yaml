appId: run.orkbot.app
---
- runFlow: launch-app.yaml
- runFlow:
    when:
      visible: "Sign up for Ork"
    commands:
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in to Ork"
    timeout: 15000
- tapOn: "Email"
- inputText: ${ORKBOT_ACTIVE_EMAIL}
- tapOn: "Password"
- inputText: ${ORKBOT_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Don’t allow"
    optional: true
- tapOn:
    text: "Don't allow"
    optional: true
# A new account answers the signup survey before the inbox.
- extendedWaitUntil:
    visible: "Account|.*How did you hear about us.*"
    timeout: 40000
