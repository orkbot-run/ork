server {
    listen 80;
    listen [::]:80;
    server_name orkbot.run www.orkbot.run www.ork.run;
    return 308 https://ork.run$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
