[package]
name = "ork-installation-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "0.10"
thiserror = "2"
uniffi = { version = "0.32.2", features = ["tokio"] }
x509-parser = "0.18"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["io-util", "sync", "rt-multi-thread", "time", "macros", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
uuid = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "ork-transport-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]
